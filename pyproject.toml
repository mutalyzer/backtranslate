[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mutalyzer_backtranslate*"]

[project]
name = "mutalyzer_backtranslate"
version = "1.0.0"
description = "Functions for reverse translation."
readme = "README.rst"
authors = [
    {name = "LUMC, Jeroen F.J. Laros", email = "J.F.J.Laros@lumc.nl"},
]
urls = {Homepage = "https://github.com/mutalyzer/backtranslate"}
keywords = ["bioinformatics"]
license = "MIT"
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "biopython>=1.76",
    "python-Levenshtein>=0.12.0",
]

[project.optional-dependencies]
test = [
    "fake-open>=0.0.1",
    "pytest-cov>=2.10.0",
    "pytest-pep8>=1.0.6",
    "pytest>=4.0.1",
]

[project.scripts]
backtranslate = "mutalyzer_backtranslate.cli:main"

[tool.pytest.ini_options]
pep8ignore = ["docs/conf.py ALL"]

[tool.coverage.report]
exclude_lines = ["def main()"]

[tool.coverage.run]
source = ["mutalyzer_backtranslate"]